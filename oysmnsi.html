<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>堀内、小林旅行</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-light bg-light fixed-top">
            <div class="container-fluid">
                <button class="navbar-toggler border-0 p-0" type="button" 
                    data-bs-toggle="offcanvas" 
                    data-bs-target="#offcanvasNavbar" 
                    aria-controls="offcanvasNavbar">
                    <!--メニュー画像-->
                    <img src="menu.jpg" alt="メニュー画像" style="width: 40px; height: 40px;">
                </button>
                <!--ライブ名-->
                <a class="navbar-brand text-wrap mx-auto text-center" href="#" id="pageTitle">Sakura Miko<br>Blooming-Parade!!</a>

                <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel" role="dialog">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">メニュー</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close" style="transform: scale(0.8);"></button>
                    </div>
                    <div class="offcanvas-body pt-0">
                        <!-- タブ切り替えメニュー -->
                        <ul class="navbar-nav nav" id="travelTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <a class="nav-link active" id="schedule-tab" data-bs-toggle="tab" data-bs-target="#schedule-pane" role="tab">スケジュール</a>
                            </li>
                            <li class="nav-item" role="presentation">
                                <a class="nav-link" id="basyo-tab" data-bs-toggle="tab" data-bs-target="#basyo-pane" role="tab">場所</a>
                            </li>
                            <li class="nav-item" role="presentation">
                                <a class="nav-link" id="motimono-tab" data-bs-toggle="tab" data-bs-target="#motimono-pane" role="tab">持ち物</a>
                            </li>
                            <li class="nav-item" role="presentation">
                                <a class="nav-link" id="okane-tab" data-bs-toggle="tab" data-bs-target="#okane-pane" role="tab">お金</a>
                            </li>
                            <li class="nav-item">
                                <!--曲URL-->
                                <a class="nav-link" href="https://youtube.com/playlist?list=PLDVPqFfLpuxCwfotweiQ5oQrwnxDctPNe&si=2EqZW2pqbz_FoXO6" target="_blank" rel="noopener noreferrer">曲</a>
                            </li>
                            <li class="nav-item">
                                <!--概要URL-->
                                <a class="nav-link" href="https://blooming-parade.hololivepro.com/" target="_blank" rel="noopener noreferrer">概要</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-3 px-4 px-md-5">
        <div class="tab-content" id="travelTabContent">
            
            <!-- 1. スケジュール -->
            <div class="tab-pane fade show active" id="schedule-pane" role="tabpanel" aria-labelledby="schedule-tab">
                <h1 class="mb-4">スケジュール</h1>
                <div class="card shadow-sm mb-3"> 
                    <div class="card-body p-0">
                        <iframe 
                            src="https://plsk.net/zenmashi?rm=minimal" 
                            style="width: 100%; height: 700px; border: none; display: block;">
                        </iframe>
                    </div>
                </div>
                <footer class="mt-3">
                    <p><img src="home1.jpg" class="img-fluid" alt="ホームページ画像"></p>
                </footer>
            </div>

            <!-- 2. 場所 -->
            <div class="tab-pane fade" id="basyo-pane" role="tabpanel" aria-labelledby="basyo-tab">
                <h1 class="mb-4">場所</h1>
                <div class="row g-3"> 
                    <div class="col-6">
                        <p class="fs-5 fw-bold mb-2"></p>
                        <p><img src="basyo1.jpg" class="img-fluid rounded" alt="1"></p>
                        <p><a class="nav-link text-primary text-decoration-underline p-0" href="https://www.google.co.jp/maps/place/K%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%8A%E6%A8%AA%E6%B5%9C/@35.4645715,139.630625,17z/data=!3m1!4b1!4m6!3m5!1s0x60185d66ccb437e9:0xb4f6cda48f02cb83!8m2!3d35.4645715!4d139.630625!16s%2Fg%2F11rj5myt_z?hl=ja&entry=ttu&g_ep=EgoyMDI2MDUyNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">地図</a></p>
                    </div>

                    <div class="col-6">
                        <p class="fs-5 fw-bold mb-2"></p>
                        <p><img src="basyo2.jpg" class="img-fluid rounded" alt="2"></p>
                        <p><a class="nav-link text-primary text-decoration-underline p-0" href="https://www.google.com/maps/place/%E3%83%95%E3%82%A1%E3%83%BC%E3%82%A4%E3%83%BC%E3%82%B9%E3%83%88%E3%83%93%E3%83%AC%E3%83%83%E3%82%B8%E3%83%9B%E3%83%86%E3%83%AB%E6%A8%AA%E6%B5%9C/@35.4479051,139.6303175,17z/data=!4m9!3m8!1s0x60185dec085fdf81:0xe5a2861ebbe665a3!5m2!4m1!1i2!8m2!3d35.4479051!4d139.6328924!16s%2Fg%2F11pb8v3g21?entry=ttu&g_ep=EgoyMDI2MDkzMC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">地図</a></p>
                    </div>

                    <div class="col-6">
                        <p class="fs-5 fw-bold mb-2"></p>
                        <p><img src="basyo3.jpg" class="img-fluid rounded" alt="3"></p>
                        <p><a class="nav-link text-primary text-decoration-underline p-0" href="地図URL" target="_blank" rel="noopener noreferrer">地図</a></p>
                    </div>

                    <div class="col-6">
                        <p class="fs-5 fw-bold mb-2"></p>
                        <p><img src="basyo4.jpg" class="img-fluid rounded" alt="4"></p>
                        <p><a class="nav-link text-primary text-decoration-underline p-0" href="地図URL" target="_blank" rel="noopener noreferrer">地図</a></p>
                    </div>
                </div>
            </div>

            <!-- 3. 持ち物 -->
            <div class="tab-pane fade" id="motimono-pane" role="tabpanel" aria-labelledby="motimono-tab">
                <h1 class="mb-4">持ち物</h1>
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <iframe 
                            src="https://plsk.net/zenmashi2?rm=minimal" 
                            style="width: 100%; height: 600px; border: none; display: block;">
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- 4. お金 -->
            <div class="tab-pane fade" id="okane-pane" role="tabpanel" aria-labelledby="okane-tab">
                <h1 class="mb-4">お金</h1>
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-0">
                        <iframe 
                            src="https://plsk.net/zenmashi3?rm=minimal" 
                            style="width: 100%; height: 400px; border: none; display: block;">
                        </iframe>
                    </div>
                </div>
                <p>
                    ホテル<br>
                    <img src="okane1.jpg" class="img-fluid border border-dark" alt="ホテルお金">
                </p>
                <p>
                    移動代<br>
                    <img src="okane2.jpg" class="img-fluid border border-dark mb-2" alt="移動1">
                    <img src="okane3.jpg" class="img-fluid border border-dark" alt="移動2">
                </p>
                <p>
                    チケット<br>
                    <img src="okane4.jpg" class="img-fluid border border-dark mb-2" alt="チケット">
                    <a class="nav-link text-primary text-decoration-underline p-0" href="https://t.pia.jp/" target="_blank" rel="noopener noreferrer">チケットぴあ</a>
                </p>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            // ナビバー位置の自動調整
            const header = document.querySelector('.navbar');
            const setPadding = () => {
                document.body.style.paddingTop = header.offsetHeight + 'px';
            };
            setPadding();
            window.addEventListener('resize', setPadding);

            // メニュー内のタブ項目を押した時にメニューを自動で閉じる処理
            const offcanvasElement = document.getElementById('offcanvasNavbar');
            const offcanvas = bootstrap.Offcanvas.getOrCreateInstance(offcanvasElement);

            document.querySelectorAll('#travelTab [data-bs-toggle="tab"]').forEach(tabLink => {
                tabLink.addEventListener('click', () => {
                    offcanvas.hide();
                });
            });
        });
    </script>
</body>
</html>
